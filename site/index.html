<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursus allemand</title>
<style>
:root {
  --ink:#111; --muted:#666; --rule:#ddd; --accent:#a52a2a;
  --paper:#fffff8; --soft:#f6f4ea;
  --a1:#7a9e7e; --a2:#5b8fa8; --b1:#c9973a; --b2:#a52a2a;
  --ok:#2e7d32; --ko:#c62828;
}
html { background:var(--paper) }
body {
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  color:var(--ink); margin:0; line-height:1.55; font-size:1rem;
}
header {
  position:sticky; top:0; z-index:10; background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.wrap { max-width:50rem; margin:0 auto; padding:0 1.25rem }
.brand { display:flex; align-items:baseline; gap:.6rem; padding:.7rem 0 0 }
.brand h1 { font-size:1.15rem; margin:0; font-weight:600; letter-spacing:-.01em }
.brand .sub { color:var(--muted); font-style:italic; font-size:.85rem }
.brand .phone { margin-left:auto; white-space:nowrap; overflow:hidden;
  min-width:0; text-overflow:ellipsis }
@media (max-width:640px) { .brand .phone { display:none } }
nav { display:flex; gap:.25rem; padding:.55rem 0 .5rem; overflow-x:auto;
  scrollbar-width:none; }
nav::-webkit-scrollbar { display:none }
nav button {
  font:inherit; font-size:.92rem; padding:.38rem .8rem; border-radius:999px;
  border:1px solid var(--rule); background:transparent; color:var(--muted);
  cursor:pointer; white-space:nowrap;
}
nav button.on { color:#fff; background:var(--accent); border-color:var(--accent) }
main section { display:none; padding:1.4rem 0 5rem }
main section.on { display:block }
main.wide { max-width:100% }
/* --- cumul commun --- */
.lvl { display:inline-block; font-weight:700; color:#fff; padding:.05rem .55rem;
  border-radius:3px; font-size:.85rem }
.A1 { background:var(--a1) } .A2 { background:var(--a2) }
.B1 { background:var(--b1) } .B2 { background:var(--b2) }
.chip { display:inline-block; font-size:.75rem; padding:.1rem .5rem; border-radius:999px;
  border:1px solid var(--rule); color:var(--muted); vertical-align:middle }
.chip.ok { color:var(--ok); border-color:var(--ok) }
.chip.ko { color:var(--ko); border-color:var(--ko) }
.chip.accent { color:var(--accent); border-color:var(--accent) }
h2 { font-weight:400; font-size:1.4rem; margin:0 0 .8rem; border-bottom:1px solid var(--rule);
  padding-bottom:.25rem }
h3 { font-weight:600; font-size:1.05rem; margin:1.4rem 0 .4rem }
p.note { color:var(--muted); font-size:.85rem; font-style:italic }
/* --- dashboard --- */
.card { background:var(--soft); border-left:3px solid var(--accent);
  padding:.8rem 1.1rem; margin:.8rem 0 }
.kv { display:flex; gap:.8rem; flex-wrap:wrap; align-items:baseline }
.kv .k { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.06em }
.counts { display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));
  gap:.6rem; margin:.8rem 0 }
.count { border:1px solid var(--rule); background:#fff; padding:.55rem .7rem }
.count .n { font-size:1.5rem; font-weight:600 }
.count .l { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.05em }
.timeline { list-style:none; padding:0; margin:1rem 0; border-left:3px solid var(--rule) }
.timeline li { position:relative; padding:.35rem 0 .7rem 1.4rem }
.timeline li::before { content:""; position:absolute; left:-.5rem; top:.75rem;
  width:.7rem; height:.7rem; border-radius:50%; background:var(--muted) }
.timeline li.en-cours::before { background:var(--accent);
  box-shadow:0 0 0 .25rem rgba(165,42,42,.18) }
.timeline li.reussi::before { background:var(--ok) }
.timeline li .gate { float:right; font-size:.75rem; color:var(--muted) }
.timeline li.en-cours .gate { color:var(--accent); font-weight:600 }
.timeline li.reussi .gate { color:var(--ok); font-weight:600 }
/* --- listes leçons --- */
.item { background:#fff; border:1px solid var(--rule); padding:.5rem .75rem;
  margin:.35rem 0; cursor:pointer; display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap }
.item.on { border-color:var(--accent); box-shadow:inset 2px 0 0 var(--accent) }
.item .num { font-weight:700; color:var(--muted); font-size:.8rem }
.item .t { flex:1; min-width:60% }
.item .d { color:var(--muted); font-size:.78rem }
/* --- leçons : liste groupée + lecteur --- */
.split { display:flex; gap:1.2rem; align-items:flex-start }
.side { flex:0 0 17rem; min-width:0; position:sticky; top:6.2rem; max-height:calc(100vh - 7rem); overflow:auto }
.side details { border:1px solid var(--rule); background:#fff; margin:.4rem 0 }
.side summary { cursor:pointer; padding:.45rem .7rem; font-size:.85rem; display:flex; gap:.5rem; align-items:center;
  list-style:none; user-select:none }
.side summary::-webkit-details-marker { display:none }
.side summary::after { content:"›"; margin-left:auto; color:var(--muted); transition:transform .15s }
.side details[open] summary::after { transform:rotate(90deg) }
.side summary .cnt { color:var(--muted); font-size:.75rem }
.side .grp { padding:0 .35rem .35rem }
.side .item { margin:.25rem 0; padding:.4rem .55rem; border-radius:3px; border-color:transparent }
.side .item:hover { background:var(--soft) }
.side .item.next { border-color:var(--accent); background:#fff }
.side .item .t { font-size:.9rem; line-height:1.3 }
.side .item .sub { flex-basis:100%; color:var(--muted); font-size:.74rem; display:flex; gap:.5rem; align-items:center }
.side .refs .item .num { display:none }
.viewer { flex:1; min-width:0 }
.viewer .bar { display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap; margin:0 0 .4rem }
.viewer .bar .ttl { font-weight:600; flex:1; min-width:10rem }
.viewer .back { display:none }
iframe { width:100%; height:calc(100vh - 11rem); min-height:24rem; border:1px solid var(--rule); background:#fff }
@media (max-width:900px) {
  .split { flex-direction:column; gap:.6rem }
  .side { flex:0 0 auto; width:100%; position:static; max-height:none }
  .split.reading .side { display:none }
  .split:not(.reading) .viewer { display:none }
  .viewer .back { display:inline-block }
  iframe { height:calc(100vh - 9rem) }
}
.openext { font-size:.8rem; color:var(--accent) }
/* --- journal / ressources --- */
.md h3 { margin:1.2rem 0 .3rem }
.md h4 { margin:.8rem 0 .2rem; font-size:.95rem }
.md ul { margin:.3rem 0 .6rem; padding-left:1.4rem }
.md p { margin:.4rem 0 }
.record { border-left:2px solid var(--rule); padding:.2rem 0 .3rem 1rem; margin:1rem 0 }
.record .meta { font-size:.75rem; color:var(--muted) }
.group { margin:1.2rem 0 }
.group h3 { margin:0 0 .6rem }
.subgroup h4 { color:var(--muted); font-weight:600; font-size:.85rem;
  text-transform:uppercase; letter-spacing:.05em; margin:1rem 0 .3rem }
.cards { display:grid; grid-template-columns:1fr; gap:.45rem }
.cardlink { background:#fff; border:1px solid var(--rule); padding:.5rem .7rem }
.cardlink a { color:var(--accent); text-decoration:none; font-weight:600 }
.cardlink a:hover { text-decoration:underline }
.cardlink .ann { color:var(--muted); font-size:.85rem; margin-top:.15rem }
.cardlink .usefor { display:inline-block; margin-top:.25rem; font-size:.72rem;
  color:var(--b2); border:1px solid var(--b2); border-radius:3px; padding:.05rem .4rem }
.search { width:100%; box-sizing:border-box; font:inherit; font-size:.95rem;
  padding:.45rem .7rem; border:1px solid var(--rule); border-radius:4px;
  background:#fff; margin:.4rem 0 .8rem }
/* --- anki --- */
.deck { background:#fff; border:1px solid var(--rule); padding:.7rem .9rem; margin:.5rem 0;
  display:flex; flex-wrap:wrap; gap:.5rem .9rem; align-items:center }
.deck .t { flex:1 1 14rem; min-width:0 }
.deck .t b { display:block }
.deck .t small { color:var(--muted) }
.deck .due { font-size:.78rem; color:var(--muted) }
.deck .due b { color:var(--accent) }
.btns { display:flex; gap:.4rem; flex-wrap:wrap }
.btn { font:inherit; font-size:.85rem; padding:.35rem .75rem; border-radius:4px; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:#fff; text-decoration:none; white-space:nowrap }
.btn.ghost { background:transparent; color:var(--ink) }
.btn.small { font-size:.78rem; padding:.25rem .55rem }
.rev { background:#fff; border:1px solid var(--rule); padding:1rem 1.1rem 1.2rem; margin:.8rem 0 }
.rev .top { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap;
  font-size:.8rem; color:var(--muted) }
.rev .face { font-size:1.55rem; text-align:center; padding:1.6rem .5rem 1.2rem; min-height:3.5rem; line-height:1.35 }
.rev .face.ans { border-top:1px solid var(--rule); color:var(--accent); font-size:1.45rem; padding-top:1.2rem }
.rev .hint { text-align:center; color:var(--muted); font-size:.8rem; font-style:italic }
.rev .grade { display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-top:.8rem }
.rev .grade button { font:inherit; padding:.6rem .2rem; border-radius:4px; border:1px solid var(--rule);
  background:#fff; cursor:pointer; font-size:.9rem }
.rev .grade button small { display:block; color:var(--muted); font-size:.7rem }
.rev .grade .g1 { border-color:var(--ko); color:var(--ko) } .rev .grade .g4 { border-color:var(--ok); color:var(--ok) }
.rev .showbtn { display:block; width:100%; margin-top:.6rem; font:inherit; padding:.7rem; border-radius:4px;
  border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; font-size:1rem }
.rev .done { text-align:center; padding:1.5rem 0; }
.rev .done .n { font-size:2rem; font-weight:600 }
.seg { display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden }
.seg button { font:inherit; font-size:.78rem; padding:.25rem .7rem; border:0; background:transparent; cursor:pointer; color:var(--muted) }
.seg button.on { background:var(--accent); color:#fff }
footer { color:var(--muted); font-size:.75rem; padding:1rem 0 2rem; border-top:1px solid var(--rule) }
@media print { header, .openext { display:none } iframe { display:none } section { display:block !important } }
</style>
</head>
<body>
<header>
  <div class="wrap brand"><h1>Cursus allemand</h1><span class="sub">zéro → Goethe B2</span><span class="sub phone" id="phoneHint"></span></div>
  <div class="wrap"><nav id="nav"></nav></div>
</header>
<main class="wrap">
<section id="tableau"></section>
<section id="lecons"></section>
<section id="anki"></section>
<section id="journal"></section>
<section id="ressources"></section>
<footer>Source : status.json · mis — <span id="maj">…</span></footer>
</main>
<script>
"use strict";
const TABS = [
  ["tableau", "Tableau"],
  ["lecons", "Leçons"],
  ["anki", "Anki"],
  ["journal", "Journal"],
  ["ressources", "Ressources"],
];
const GATE_LABEL = { "verrouille":"verrouillé", "en-cours":"en cours", "reussi":"réussi" };
const ETAT_LABEL = { "generee":"générée", "faite":"faite", "a-faire":"à faire", "en-cours":"en cours" };
const NIVEAUX = ["A1", "A2", "B1", "B2", "C1"];
let STATUS = {};

const nav = document.getElementById("nav");
TABS.forEach(([id, label]) => {
  const b = document.createElement("button");
  b.textContent = label; b.dataset.tab = id;
  b.onclick = () => show(id);
  nav.appendChild(b);
});
function show(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === id));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === id));
  const main = document.querySelector("main");
  main.classList.toggle("wide", id === "lecons");
  try { history.replaceState(null, "", "#" + id); } catch(e) {}
}
function currentTab() { return (location.hash || "#tableau").slice(1); }

const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const inline = s => esc(s)
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
      `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
  .replace(/`([^`]+)`/g, "<code>$1</code>");

// mini rendu markdown : titres, puces, paragraphes, liens, gras, code — rien d'autre
function md(src) {
  const out = [];
  for (const raw of src.split(/\r?\n/)) {
    const line = raw.trimEnd();
    if (!line.trim()) { out.push("</ul>"); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if (h) { out.push(`<h${h[1].length + 2}>${inline(h[2])}</h${h[1].length + 2}>`); continue; }
    const li = line.match(/^\s*-\s+(.*)/);
    if (li) { out.push(`<li>${inline(li[1])}</li>`); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  return out.join("\n").replace(/(<\/ul>\s*)+/g, "</ul>")
           .replace(/<\/ul>(\s*<\/ul>)+/g, "</ul>")
           .replace(/((?:<li>.*?<\/li>\s*)+)/gs, "<ul>$1</ul>");
}

async function get(url) {
  // cache-busting : GitHub Pages sert status.json / index.json avec max-age=600
  const bust = /\.(json|md|txt)$/.test(url) ? (url.includes("?") ? "&" : "?") + "v=" + Date.now() : "";
  const r = await fetch(url + bust, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " → " + r.status);
  return r.text();
}

function renderDashboard(s) {
  const lvlClass = (s.niveau || "A1").replace(/^([ABC][12])$/, "$1");
  const gates = ["A1","A2","B1","B2"].map(g => {
    const st = (s.gates && s.gates[g]) || "verrouille";
    return `<li class="${st}"><span class="lvl ${g}">${g}</span> <span class="gate">${GATE_LABEL[st] || st}</span></li>`;
  }).join("");
  document.getElementById("tableau").innerHTML = `
    <div class="card kv">
      <span class="lvl ${lvlClass}">${esc(s.niveau || "?")}</span>
      <span><span class="k">semaine</span> ${esc(String(s.semaine ?? "—"))}</span>
      <span>${esc(s.positionActuelle || "")}</span>
    </div>
    <h3>Portes de passage</h3>
    <ul class="timeline">${gates}</ul>
    <div class="card"><strong>Prochaine étape</strong><br>${esc(s.prochaineEtape || "—")}</div>
    <div class="counts">
      <div class="count"><div class="n">${s.anki?.cartes ?? 0}</div><div class="l">cartes Anki</div></div>
      <div class="count"><div class="n">${s.compteurs?.leconsFaites ?? 0}</div><div class="l">leçons faites</div></div>
      <div class="count"><div class="n">${s.compteurs?.leconsGenerees ?? 0}</div><div class="l">leçons générées</div></div>
      <div class="count"><div class="n">${s.records?.length ?? 0}</div><div class="l">learning-records</div></div>
    </div>`;
  document.getElementById("maj").textContent = s.misAJour || "—";
}

function renderLecons(s) {
  const lecons = (s.lecons || []).slice().sort((a, b) => a.numero - b.numero);
  const refs = s.references || [];
  const next = lecons.find(l => l.etat !== "faite") || null;
  const niveauCourant = s.niveau || "A1";
  const byLevel = list => {
    const m = new Map();
    list.forEach(it => { const k = it.niveau || "Transversal"; if (!m.has(k)) m.set(k, []); m.get(k).push(it); });
    const order = [...NIVEAUX, "Transversal", ...[...m.keys()].filter(k => !NIVEAUX.includes(k) && k !== "Transversal")];
    return order.filter(k => m.has(k)).map(k => [k, m.get(k)]);
  };
  const lessonItem = it => `
    <div class="item ${next && it.numero === next.numero ? "next" : ""}" data-f="${esc(it.fichier)}" data-title="${esc(it.titre)}">
      <span class="num">${String(it.numero).padStart(2, "0")}</span>
      <span class="t">${esc(it.titre)}</span>
      <span class="sub">
        <span class="chip ${it.etat === "faite" ? "ok" : (next && it.numero === next.numero ? "accent" : "")}">${next && it.numero === next.numero && it.etat !== "faite" ? "prochaine" : (ETAT_LABEL[it.etat] || esc(it.etat || ""))}</span>
        ${it.duree ? `<span>≈ ${it.duree} min</span>` : ""}
        ${it.faiteLe ? `<span>faite le ${esc(it.faiteLe)}</span>` : (it.date ? `<span>${esc(it.date)}</span>` : "")}
      </span>
    </div>`;
  const refItem = it => `
    <div class="item" data-f="${esc(it.fichier)}" data-title="${esc(it.titre)}">
      <span class="t">${esc(it.titre)}</span>
      ${it.date ? `<span class="sub"><span>${esc(it.date)}</span></span>` : ""}
    </div>`;
  const group = (k, items, html, openIf) => {
    const done = items.filter(i => i.etat === "faite").length;
    const isLvl = NIVEAUX.includes(k);
    return `<details ${openIf ? "open" : ""}>
      <summary>${isLvl ? `<span class="lvl ${k}">${k}</span>` : `<strong>${esc(k)}</strong>`}
        <span class="cnt">${html === lessonItem ? `${done} / ${items.length} faites` : `${items.length} fiche${items.length > 1 ? "s" : ""}`}</span></summary>
      <div class="grp">${items.map(html).join("")}</div></details>`;
  };
  const el = document.getElementById("lecons");
  el.innerHTML = `
    <div class="split" id="split">
      <div class="side">
        <h4>Leçons</h4>
        ${lecons.length ? byLevel(lecons).map(([k, items]) =>
            group(k, items, lessonItem, k === niveauCourant || items.some(i => i.etat !== "faite"))).join("")
          : `<p class="note">Aucune leçon dans status.json.</p>`}
        <h4>Fiches de référence</h4>
        <div class="refs">${byLevel(refs).map(([k, items]) => group(k, items, refItem, k === niveauCourant || k === "Transversal")).join("")}</div>
      </div>
      <div class="viewer">
        <div class="bar">
          <button class="btn ghost small back" id="back">‹ Liste</button>
          <span class="ttl" id="ttl">Choisis une leçon ou une fiche dans la liste</span>
          <a class="openext" id="ext" href="#" target="_blank" rel="noopener">ouvrir dans un nouvel onglet ›</a>
        </div>
        <iframe id="fr" title="lecteur"></iframe>
      </div>
    </div>`;
  const split = el.querySelector("#split"), fr = el.querySelector("#fr"), ext = el.querySelector("#ext"), ttl = el.querySelector("#ttl");
  const pick = (btn, scroll) => {
    el.querySelectorAll(".item").forEach(x => x.classList.remove("on"));
    btn.classList.add("on");
    fr.src = "../" + btn.dataset.f; ext.href = "../" + btn.dataset.f; ttl.textContent = btn.dataset.title;
    split.classList.add("reading");
    if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
  };
  el.querySelectorAll(".item").forEach(b => b.onclick = () => pick(b, true));
  el.querySelector("#back").onclick = () => split.classList.remove("reading");
  const start = el.querySelector(".item.next") || el.querySelector(".item");
  if (start && window.innerWidth > 900) pick(start, false);
}

async function renderJournal(s) {
  const el = document.getElementById("journal");
  try {
    const notes = await get("../NOTES.md");
    let body = `<h3>Notes de travail (professeur)</h3><div class="md">${md(notes)}</div>`;
    const recs = (s.records || []).slice().reverse();
    if (recs.length) {
      body += `<h3>Learning-records</h3>`;
      const texts = await Promise.all(recs.map(r => get("../" + r.fichier).catch(() => null)));
      body += recs.map((r, i) => `
        <div class="record">
          <div class="meta">#${String(r.numero).padStart(4,"0")} · ${esc(r.titre)}${r.date ? " · " + esc(r.date) : ""}</div>
          <div class="md">${texts[i] ? md(texts[i]) : "<p class='note'>fichier introuvable : " + esc(r.fichier) + "</p>"}</div>
        </div>`).join("");
    }
    el.innerHTML = body;
  } catch (e) {
    el.innerHTML = `<p class="note">Journal indisponible (${esc(e.message)}).</p>`;
  }
}

async function renderRessources() {
  const el = document.getElementById("ressources");
  try {
    const src = await get("../RESOURCES.md");
    const cards = [];
    let group = "", subgroup = "";
    for (const raw of src.split(/\r?\n/)) {
      const line = raw.trimEnd();
      const g2 = line.match(/^##\s+(.*)/), g3 = line.match(/^###\s+(.*)/);
      if (g2) { group = g2[1].trim(); subgroup = ""; continue; }
      if (g3) { subgroup = g3[1].trim(); continue; }
      const bullet = line.match(/^\s*-\s+(.*)/);
      if (!bullet) {
        /* ligne d'annotation : rattachée à la dernière carte du groupe en cours */
        const t = line.trim();
        if (t && cards.length) {
          const last = cards[cards.length - 1];
          const m = t.match(/^(.*?)(Use for\s*:.*)$/);
          if (m) { last.ann = m[1].trim(); last.usefor = m[2].trim(); }
          else { last.ann = (last.ann ? last.ann + " " : "") + t; }
        }
        continue;
      }
      /* une puce peut contentir plusieurs liens séparés par « · » */
      for (const part of bullet[1].split(/\s*·\s*/)) {
        const links = [];
        const re = /\[([^\]]+)\]\(([^)\s]+)\)/g;
        let m;
        while ((m = re.exec(part))) links.push(m);
        cards.push({
          group, subgroup, ann: "", usefor: "",
          html: links.length
            ? links.map(l => `<a href="${l[2]}" target="_blank" rel="noopener">${esc(l[1])}</a>`)
                    .join(" · ")
            : esc(part),
          txt: part.toLowerCase(),
        });
      }
    }
    const frag = document.createDocumentFragment();
    let curG = null, curS = null, groupEl = null, subEl = null;
    for (const c of cards) {
      if (c.group !== curG) {
        curG = c.group;
        groupEl = document.createElement("div"); groupEl.className = "group";
        const h = document.createElement("h3"); h.textContent = c.group ?? "";
        groupEl.appendChild(h);
        subEl = null; curS = null;
        frag.appendChild(groupEl);
      }
      if (c.subgroup && c.subgroup !== curS) {
        curS = c.subgroup;
        subEl = document.createElement("div"); subEl.className = "subgroup";
        const h = document.createElement("h4"); h.textContent = c.subgroup;
        subEl.appendChild(h);
        (groupEl || frag).appendChild(subEl);
      }
      const card = document.createElement("div");
      card.className = "cardlink";
      card.dataset.txt = (c.txt + " " + c.ann + " " + c.usefor).toLowerCase();
      card.innerHTML = `<div>${c.html}</div>`
        + (c.ann ? `<div class="ann">${inline(c.ann)}</div>` : "")
        + (c.usefor ? `<div class="usefor">${inline(c.usefor)}</div>` : "");
      (subEl || groupEl || frag).appendChild(card);
    }
    const search = document.createElement("input");
    search.className = "search"; search.type = "search";
    search.placeholder = "Rechercher une ressource…";
    el.innerHTML = "";
    el.appendChild(search);
    el.appendChild(frag);
    search.oninput = () => {
      const q = search.value.toLowerCase();
      el.querySelectorAll(".cardlink").forEach(c =>
        c.style.display = (c.dataset.txt || "").includes(q) ? "" : "none");
    };
  } catch (e) {
    el.innerHTML = `<p class="note">Ressources indisponibles (${esc(e.message)}).</p>`;
  }
}

/* ===================== Anki : decks, téléchargement, réviseur ===================== */
const ANKI = { manifest: null, decks: [], cards: {} };   // cards[deckId] = [{r, v, key}]
const PKEY = "cursus.anki.progress.v1", SKEY = "cursus.anki.settings.v1";
const today = () => Math.floor(Date.now() / 86400000);
const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const saveJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let PROG = loadJSON(PKEY, {});
let SET = Object.assign({ dir: "fr", voix: true, nouvelles: 20 }, loadJSON(SKEY, {}));
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33) ^ s.charCodeAt(i); return (h >>> 0).toString(36); };

function parseDeckTxt(txt) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith("#") && l.includes(";"))
    .map(l => { const i = l.indexOf(";"); return { r: l.slice(0, i).trim(), v: l.slice(i + 1).trim() }; });
}
async function loadAnki() {
  ANKI.manifest = JSON.parse(await get("../anki/index.json"));
  ANKI.decks = ANKI.manifest.decks || [];
  await Promise.all(ANKI.decks.map(async d => {
    try { ANKI.cards[d.id] = parseDeckTxt(await get("../" + d.fichierTxt)).map(c => ({ ...c, deck: d.id })); }
    catch (e) { ANKI.cards[d.id] = []; }
  }));
}
const ckey = c => c.deck + "|" + SET.dir + "|" + hash(c.r);
function stats(deckIds) {
  let due = 0, neu = 0, tot = 0, t = today();
  deckIds.forEach(id => (ANKI.cards[id] || []).forEach(c => {
    tot++; const p = PROG[ckey(c)];
    if (!p) neu++; else if (p.due <= t) due++;
  }));
  return { due, neu, tot };
}

let voixDE = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  voixDE = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speakDE(text) {
  if (!voixDE || !SET.voix) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g, "").replace(/\s*[:–—-]\s*/g, ", "));
  u.voice = voixDE; u.lang = voixDE.lang; u.rate = 0.85; speechSynthesis.speak(u);
}

function renderAnki() {
  const el = document.getElementById("anki");
  if (!ANKI.manifest) { el.innerHTML = `<p class="note">anki/index.json introuvable : lance <code>python build_anki.py</code> à la racine.</p>`; return; }
  const all = ANKI.decks.map(d => d.id), sAll = stats(all);
  const deckHTML = d => {
    const s = stats([d.id]);
    return `<div class="deck">
      <div class="t"><b>${esc(d.titre)}</b><small>${esc(d.deck)} · ${d.cartes} cartes${d.type === "it" ? " · <span class='chip accent'>IT</span>" : ""}</small>
        <div class="due">à revoir <b>${s.due}</b> · nouvelles ${s.neu}</div></div>
      <div class="btns">
        <button class="btn" data-rev="${d.id}">Réviser ici</button>
        <a class="btn ghost" href="../${d.fichierApkg}" download>.apkg</a>
        <a class="btn ghost small" href="../${d.fichierTxt}" download>.txt</a>
      </div></div>`;
  };
  el.innerHTML = `
    <h2>Anki : révision espacée</h2>
    <div class="card">
      <div class="kv"><span><span class="k">total</span> ${sAll.tot} cartes</span>
        <span><span class="k">à revoir aujourd'hui</span> <strong>${sAll.due}</strong></span>
        <span><span class="k">nouvelles</span> ${sAll.neu}</span>
        <span class="seg" id="dirSeg"><button data-d="fr" class="${SET.dir === "fr" ? "on" : ""}">FR → DE</button><button data-d="de" class="${SET.dir === "de" ? "on" : ""}">DE → FR</button></span>
      </div>
      <div class="btns" style="margin-top:.6rem">
        <button class="btn" data-rev="*">Tout réviser (${sAll.due + Math.min(SET.nouvelles, sAll.neu)})</button>
        <a class="btn ghost" href="../${ANKI.manifest.tout.fichierApkg}" download>Tout dans Anki (.apkg, ${ANKI.manifest.tout.cartes} cartes)</a>
      </div>
      <p class="note" style="margin:.6rem 0 0">Deux façons de réviser : <strong>ici</strong> (sur n'importe quel appareil, progression enregistrée dans ce navigateur) ou dans <strong>l'application Anki</strong> : télécharge le .apkg, ouvre-le, il s'importe seul (AnkiDroid sur Android, Anki sur PC). Réimporter un paquet mis à jour n'ajoute que les nouvelles cartes.</p>
    </div>
    <div id="revPanel"></div>
    <h3>Par leçon</h3>
    ${ANKI.decks.slice().reverse().map(deckHTML).join("")}
    <h3>Progression du réviseur intégré</h3>
    <div class="btns">
      <button class="btn ghost small" id="expProg">Exporter la progression</button>
      <label class="btn ghost small" style="cursor:pointer">Importer <input type="file" id="impProg" accept="application/json" hidden></label>
      <button class="btn ghost small" id="voixBtn">Voix allemande : ${SET.voix ? "activée" : "coupée"}${voixDE ? "" : " (aucune voix installée)"}</button>
    </div>
    <p class="note">La progression du réviseur intégré est locale à ce navigateur. Exporte-la pour la reprendre sur un autre appareil. L'application Anki, elle, synchronise via AnkiWeb.</p>`;
  el.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => startReview(b.dataset.rev === "*" ? all : [b.dataset.rev]));
  el.querySelectorAll("#dirSeg button").forEach(b => b.onclick = () => { SET.dir = b.dataset.d; saveJSON(SKEY, SET); renderAnki(); });
  el.querySelector("#voixBtn").onclick = () => { SET.voix = !SET.voix; saveJSON(SKEY, SET); renderAnki(); };
  el.querySelector("#expProg").onclick = () => {
    const blob = new Blob([JSON.stringify({ progress: PROG, settings: SET, date: new Date().toISOString() })], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "progression-anki.json"; a.click();
  };
  el.querySelector("#impProg").onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); Object.assign(PROG, j.progress || {}); saveJSON(PKEY, PROG); renderAnki(); }
    catch (e) { alert("Fichier illisible."); }
  };
}

/* --- réviseur : SM-2 simplifié (Encore / Difficile / Bien / Facile) --- */
let REV = null;
function grade(c, g) {
  const k = ckey(c), t = today();
  const p = PROG[k] || { iv: 0, ef: 2.5, reps: 0, lapses: 0, due: t };
  if (g === 1) { p.reps = 0; p.lapses++; p.iv = 0; p.ef = Math.max(1.3, p.ef - 0.2); p.due = t; }
  else {
    p.reps++;
    if (g === 2) { p.iv = p.iv < 1 ? 1 : Math.round(p.iv * 1.2); p.ef = Math.max(1.3, p.ef - 0.15); }
    else if (g === 3) { p.iv = p.iv < 1 ? 1 : (p.reps <= 2 ? 4 : Math.round(p.iv * p.ef)); }
    else { p.iv = p.iv < 1 ? 3 : Math.round(p.iv * p.ef * 1.3); p.ef += 0.15; }
    p.due = t + p.iv;
  }
  PROG[k] = p; saveJSON(PKEY, PROG);
}
function startReview(deckIds) {
  const t = today(), due = [], neu = [];
  deckIds.forEach(id => (ANKI.cards[id] || []).forEach(c => { const p = PROG[ckey(c)]; if (!p) neu.push(c); else if (p.due <= t) due.push(c); }));
  for (let i = due.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [due[i], due[j]] = [due[j], due[i]]; }
  const queue = due.concat(neu.slice(0, SET.nouvelles));
  const names = deckIds.length === 1 ? (ANKI.decks.find(d => d.id === deckIds[0]) || {}).titre : "Tous les decks";
  REV = { queue, total: queue.length, done: 0, again: 0, name: names || "", shown: false };
  renderReview();
  document.getElementById("revPanel").scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderReview() {
  const el = document.getElementById("revPanel");
  if (!REV) { el.innerHTML = ""; return; }
  if (!REV.queue.length) {
    el.innerHTML = `<div class="rev"><div class="done"><div class="n">${REV.done}</div>cartes revues · ${REV.again} à retravailler<br><br>
      <button class="btn" id="revBack">Retour aux decks</button></div></div>`;
    el.querySelector("#revBack").onclick = () => { REV = null; renderAnki(); };
    return;
  }
  const c = REV.queue[0], q = SET.dir === "fr" ? c.v : c.r, a = SET.dir === "fr" ? c.r : c.v;
  el.innerHTML = `<div class="rev">
    <div class="top"><span>${esc(REV.name)}</span><span>${REV.done} / ${REV.total} · reste ${REV.queue.length}</span>
      <button class="btn ghost small" id="revQuit">Quitter</button></div>
    <div class="face">${esc(q)}</div>
    <div class="hint">${SET.dir === "fr" ? "dis-le en allemand, à voix haute" : "traduis en français"}</div>
    ${REV.shown ? `<div class="face ans">${esc(a)}</div>
      <div class="grade">
        <button class="g1" data-g="1">Encore<small>tout de suite</small></button>
        <button class="g2" data-g="2">Difficile<small>1 jour</small></button>
        <button class="g3" data-g="3">Bien<small>${(PROG[ckey(c)] || {}).iv >= 1 ? "×" + ((PROG[ckey(c)] || {}).ef || 2.5).toFixed(1) : "1 jour"}</small></button>
        <button class="g4" data-g="4">Facile<small>${(PROG[ckey(c)] || {}).iv >= 1 ? "×" + (((PROG[ckey(c)] || {}).ef || 2.5) * 1.3).toFixed(1) : "3 jours"}</small></button>
      </div>` : `<button class="showbtn" id="revShow">Afficher la réponse</button>`}
    </div>`;
  el.querySelector("#revQuit").onclick = () => { REV = null; renderAnki(); };
  if (!REV.shown) {
    el.querySelector("#revShow").onclick = () => { REV.shown = true; renderReview(); speakDE(c.r); };
  } else {
    el.querySelectorAll(".grade button").forEach(b => b.onclick = () => {
      const g = +b.dataset.g; grade(c, g); REV.queue.shift(); REV.shown = false;
      if (g === 1) { REV.again++; REV.queue.splice(Math.min(3, REV.queue.length), 0, c); } else REV.done++;
      renderReview();
    });
  }
}
document.addEventListener("keydown", e => {
  if (!REV || !REV.queue.length || currentTab() !== "anki" || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!REV.shown) document.getElementById("revShow")?.click(); }
  else if (/^[1-4]$/.test(e.key) && REV.shown) document.querySelector(`.grade button[data-g="${e.key}"]`)?.click();
});

async function boot() {
  try {
    STATUS = JSON.parse(await get("../status.json"));
  } catch (e) {
    document.getElementById("tableau").innerHTML =
      `<p class="note">status.json illisible (${esc(e.message)}). Le serveur tourne-t-il depuis la racine du workspace ?</p>`;
  }
  try { await loadAnki(); STATUS.anki = Object.assign({}, STATUS.anki, { cartes: ANKI.manifest.tout.cartes }); } catch (e) { /* pas de manifeste */ }
  get("../config.json").then(c => {
    const cfg = JSON.parse(c);
    const hint = document.getElementById("phoneHint");
    if (hint && cfg.urlTelephone) hint.innerHTML =
      `📱 <a href="${cfg.urlTelephone}" style="color:inherit">${esc(cfg.urlTelephone)}</a>`;
  }).catch(() => { /* http.server brut : pas d'affichage téléphone */ });
  renderDashboard(STATUS);
  renderLecons(STATUS);
  renderAnki();
  renderJournal(STATUS);
  renderRessources();
  show(TABS.some(([id]) => id === currentTab()) ? currentTab() : "tableau");
}
boot();
